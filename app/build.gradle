plugins {
    id "com.android.application"
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def openAiKey = localProps.getProperty("OPENAI_API_KEY", System.getenv("OPENAI_API_KEY") ?: "")
def openAiModel = localProps.getProperty("OPENAI_MODEL", "gpt-4o-mini")

android {
    namespace "com.example.sit305task81"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.sit305task81"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "OPENAI_API_KEY", "\"${openAiKey.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        buildConfigField "String", "OPENAI_MODEL", "\"${openAiModel.replace("\\", "\\\\").replace("\"", "\\\"")}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
}
